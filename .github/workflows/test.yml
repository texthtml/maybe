name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: ${{ (matrix.php-versions == '8.4' || matrix.php-versions == '8.5') && 'pcov' || 'none' }}
          ini-values:  zend.assertions=1,  assert.exception=1

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run the unit tests
        run: |
          vendor/bin/phpunit --version
          vendor/bin/phpunit --testdox

      - name: Run the unit tests with coverage (PHP 8.4 & 8.5)
        if: matrix.php-versions == '8.4' || matrix.php-versions == '8.5'
        run: |
          # fail the job if line coverage drops below 99%
          pct=$(vendor/bin/phpunit --coverage-text | grep '^  Lines:' | sed 's/.*:  *\([0-9.]*\)%.*/\1/')
          echo "line coverage: ${pct}%"
          awk "BEGIN {exit !(${pct:-0} >= 99)}" || { echo "line coverage is below the 99% threshold"; exit 1; }

      - name: Run mutation testing (PHP 8.4 only)
        if: matrix.php-versions == '8.4'
        env:
          INFECTION_BADGER_ENABLED: 0
        run: |
          # baseline MSI gate; raise as the suite gets stronger
          vendor/bin/infection --threads=4 --no-progress --min-msi=95

      - name: Run the doc tests
        run: |
          vendor/bin/doctest --version
          vendor/bin/doctest

      - name: Run linter
        run: |
          vendor/bin/phpcs --version
          vendor/bin/phpcs -ps

      - name: Check code formatting (mago fmt)
        run: |
          vendor/bin/mago fmt --check

      - name: Run static analysis (PHPStan)
        run: |
          vendor/bin/phpstan --version
          vendor/bin/phpstan

      - name: Run static analysis (Psalm)
        run: |
          vendor/bin/psalm --version
          vendor/bin/psalm

      - name: Run static analysis (Mago)
        run: |
          vendor/bin/mago --version
          vendor/bin/mago lint
          vendor/bin/mago analyze
        env:
          # the composer wrapper downloads the mago binary from github releases on first run
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
