codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "99...100"

  status:
    project:
      default:
        target: 99%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
